<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instagram</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="nav-left">Instagram</div>
  <input type="text" placeholder="Search">
  <div class="nav-right">
    <span>🏠</span>
    <span>💬</span>
    <span>➕</span>
    <span>❤️</span>
    <span>👤</span>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- FEED -->
  <div class="feed">

    <!-- STORIES -->
    <div class="stories">
      <div class="story">Your Story</div>
      <div class="story">User1</div>
      <div class="story">User2</div>
      <div class="story">User3</div>
      <div class="story">User4</div>
    </div>

    <!-- POST -->
    <div class="post">
      <div class="post-header">
        <strong>user_name</strong>
      </div>
      <img src="https://picsum.photos/500/400" alt="post">
      <div class="post-actions">
        ❤️ 💬 📤
      </div>
      <div class="post-caption">
        <strong>user_name</strong> This is a sample Instagram post caption.
      </div>
    </div>

    <div class="post">
      <div class="post-header">
        <strong>another_user</strong>
      </div>
      <img src="https://picsum.photos/500/401" alt="post">
      <div class="post-actions">
        ❤️ 💬 📤
      </div>
      <div class="post-caption">
        <strong>another_user</strong> Loving this view 🌄
      </div>
    </div>

  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="profile">
      <strong>your_name</strong>
      <p>@username</p>
    </div>

    <h4>Suggestions for you</h4>

    <div class="suggestion">user_one</div>
    <div class="suggestion">user_two</div>
    <div class="suggestion">user_three</div>
  </div>

</div>

</body>
</html>
